<script>
/* ============ BANK SOAL (mudah diedit: tambah objek baru) ============
 j=jenjang m=materi t=tingkat tp=tipe(pg|pgk|bs|isian) s=stimulus q=soal o=opsi k=kunci p=pembahasan
 pg: k=indeks opsi | pgk: k=array indeks | bs: k=array true/false per pernyataan | isian: k=angka */
/* ===== ILUSTRASI SVG & EMOJI (dipakai sebagai stimulus soal) ===== */
const SV=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;max-width:100%;display:block;margin:10px auto" font-size="14" fill="currentColor" font-family="system-ui,sans-serif">${b}</svg>`;
const ST='stroke="currentColor" stroke-width="2" fill="#4da3ff44"';
const TX=(x,y,t,a="middle")=>`<text x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;
const rect=(p,l)=>{const w=190,h=Math.max(50,Math.min(130,w*l/p));return SV(290,h+50,`<rect x="35" y="25" width="${w}" height="${h}" ${ST}/>${TX(130,18,p+" cm")}${TX(232,25+h/2+5,l+" cm","start")}`)};
const tri=(a,b)=>{const s=150/Math.max(a,b),A=a*s,B=b*s;return SV(290,A+55,`<polygon points="75,25 75,${25+A} ${75+B},${25+A}" ${ST}/><path d="M75 ${13+A}h12v12" fill="none" stroke="currentColor"/>${TX(67,25+A/2+5,a+" cm","end")}${TX(75+B/2,25+A+22,b+" cm")}${TX(75+B/2+10,25+A/2-4,"?","start")}`)};
const trap=(a,b,t)=>{const s=200/b,ta=a*s,th=Math.max(50,Math.min(110,t*s)),o=(200-ta)/2;return SV(290,th+55,`<polygon points="${40+o},25 ${40+o+ta},25 240,${25+th} 40,${25+th}" ${ST}/>${TX(140,18,a+" cm")}${TX(140,25+th+20,b+" cm")}<line x1="${40+o}" y1="25" x2="${40+o}" y2="${25+th}" stroke="currentColor" stroke-dasharray="4"/>${TX(46+o,25+th/2+5,t+" cm","start")}`)};
const bars=(n,v)=>{const m=Math.max(...v),w=260/n;return SV(300,185,`<line x1="30" y1="150" x2="290" y2="150" stroke="currentColor"/>`+v.map((x,i)=>{const h=x/m*110,X=35+i*w,c=X+(w-14)/2;return `<rect x="${X}" y="${150-h}" width="${w-14}" height="${h}" fill="#2f8fff"/>`+TX(c,144-h,x)+TX(c,170,n[i])}).join(""))};
const balls=(r,b)=>{const c=(n,col,y)=>Array.from({length:n},(_,i)=>`<circle cx="${30+i*34}" cy="${y}" r="14" fill="${col}"/>`).join("");return SV(280,110,c(r,"#e5484d",30)+c(b,"#2f8fff",75))};
const ico=(e,n)=>`<div style="font-size:30px;text-align:center;line-height:1.4">${e.repeat(n)}</div>`;
const TB="<table class=t><tr><th>Buah<th>Jumlah<tr><td>Apel<td>8<tr><td>Jeruk<td>12<tr><td>Mangga<td>5<tr><td>Pisang<td>10</table>"+bars(["Apel","Jeruk","Mangga","Pisang"],[8,12,5,10]);
const TN="<table class=t><tr><th>Siswa<th>Nilai<tr><td>Ani<td>80<tr><td>Budi<td>70<tr><td>Cici<td>90<tr><td>Dedi<td>60<tr><td>Eka<td>100</table>"+bars(["Ani","Budi","Cici","Dedi","Eka"],[80,70,90,60,100]);
const BANK=[
// ---------- SD ----------
{j:"SD",m:"Operasi Bilangan",t:"mudah",tp:"pg",q:"245 + 378 = ...",o:["513","623","633","723"],k:1,p:"245 + 378 = 623."},
{j:"SD",m:"Pecahan",t:"mudah",tp:"pg",q:"1/2 + 1/4 = ...",o:["2/6","3/4","1/6","3/8"],k:1,p:"1/2 = 2/4, sehingga 2/4 + 1/4 = 3/4."},
{j:"SD",m:"Bangun Datar",t:"sedang",tp:"isian",s:rect(12,8),q:"Sebuah persegi panjang berukuran panjang 12 cm dan lebar 8 cm. Keliling persegi panjang tersebut ... cm.",k:40,p:"K = 2 × (12 + 8) = 40 cm."},
{j:"SD",m:"Bangun Datar",t:"sedang",tp:"pgk",q:"Pilih semua bangun datar yang memiliki 4 sisi.",o:["Persegi","Segitiga","Jajar genjang","Lingkaran","Trapesium"],k:[0,2,4],p:"Persegi, jajar genjang, dan trapesium memiliki 4 sisi."},
{j:"SD",m:"Pengukuran",t:"sedang",tp:"bs",q:"Tentukan benar atau salah tiap pernyataan berikut.",o:["1 km = 1.000 m","2 kg = 200 g","3 jam = 180 menit"],k:[true,false,true],p:"2 kg = 2.000 g, jadi pernyataan kedua salah."},

{j:"SD",m:"Data Sederhana",t:"mudah",tp:"pg",s:TB,q:"Berdasarkan tabel, jumlah seluruh buah adalah ...",o:["30","35","40","45"],k:1,p:"8 + 12 + 5 + 10 = 35."},

{j:"SD",m:"Operasi Bilangan",t:"sedang",tp:"pg",s:ico("🍚",3),q:"Ibu membeli 3 kg beras dengan harga Rp12.000 per kg. Total yang dibayar ibu adalah ...",o:["Rp34.000","Rp36.000","Rp38.000","Rp39.000"],k:1,p:"3 × 12.000 = 36.000."},
{j:"SD",m:"Pecahan",t:"sulit",tp:"bs",q:"Tentukan benar atau salah.",o:["3/4 > 1/2","2/3 = 4/6","1/5 > 1/4"],k:[true,true,false],p:"1/5 < 1/4 karena penyebut lebih besar berarti bagian lebih kecil."},
// ---------- SMP ----------
{j:"SMP",m:"Aljabar",t:"mudah",tp:"pg",q:"Jika 2x + 5 = 17, maka nilai x adalah ...",o:["4","5","6","7"],k:2,p:"2x = 17 − 5 = 12, sehingga x = 6."},
{j:"SMP",m:"Persamaan Linear",t:"sedang",tp:"pg",q:"Penyelesaian dari 5x − 4 = 3x + 6 adalah ...",o:["3","4","5","6"],k:2,p:"5x − 3x = 6 + 4 → 2x = 10 → x = 5."},
{j:"SMP",m:"Geometri",t:"sedang",tp:"isian",s:tri(8,6),q:"Segitiga siku-siku memiliki alas 6 cm dan tinggi 8 cm. Panjang sisi miringnya ... cm.",k:10,p:"√(6² + 8²) = √100 = 10."},
{j:"SMP",m:"Geometri",t:"sedang",tp:"pgk",q:"Pilih semua pernyataan yang BENAR tentang persegi.",o:["Keempat sisinya sama panjang","Kedua diagonalnya sama panjang","Diagonalnya tidak berpotongan tegak lurus","Memiliki 4 sumbu simetri"],k:[0,1,3],p:"Diagonal persegi berpotongan tegak lurus, jadi opsi ketiga salah."},
{j:"SMP",m:"Statistika",t:"sedang",tp:"bs",q:"Data: 4, 6, 6, 8, 10, 6. Tentukan benar atau salah.",o:["Modusnya 6","Rata-ratanya 6","Mediannya 6"],k:[true,false,true],p:"Rata-rata = 40/6 ≈ 6,67. Data terurut 4,6,6,6,8,10 → median = (6+6)/2 = 6."},
{j:"SMP",m:"Peluang",t:"mudah",tp:"pg",s:ico("🎲",1),q:"Sebuah dadu dilempar sekali. Peluang muncul mata dadu genap adalah ...",o:["1/6","1/3","1/2","2/3"],k:2,p:"Genap: 2, 4, 6 → 3/6 = 1/2."},
{j:"SMP",m:"Statistika",t:"mudah",tp:"isian",s:TN,q:"Rata-rata nilai kelima siswa tersebut adalah ...",k:80,p:"(80+70+90+60+100)/5 = 400/5 = 80."},
{j:"SMP",m:"Persamaan Linear",t:"sedang",tp:"pg",q:"Gradien garis y = 3x − 5 adalah ...",o:["−5","3","5","−3"],k:1,p:"Pada y = mx + c, gradien m = 3."},
{j:"SMP",m:"Aljabar",t:"sedang",tp:"pg",q:"Bentuk sederhana dari 3a + 2b − a + 4b adalah ...",o:["2a + 6b","4a + 6b","2a + 2b","3a + 6b"],k:0,p:"(3a − a) + (2b + 4b) = 2a + 6b."},
{j:"SMP",m:"Peluang",t:"sulit",tp:"isian",q:"Sebuah kantong berisi 3 bola merah, 5 biru, dan 2 kuning. Satu bola diambil acak. Peluang terambil bola merah adalah ... %.",k:30,p:"3/10 = 30%."},
// ---------- SMA ----------
{j:"SMA",m:"Fungsi",t:"mudah",tp:"pg",q:"Jika f(x) = x² − 2x + 1, maka f(3) = ...",o:["2","4","6","8"],k:1,p:"9 − 6 + 1 = 4."},
{j:"SMA",m:"Trigonometri",t:"mudah",tp:"pg",q:"Nilai sin 30° adalah ...",o:["1/2","√2/2","√3/2","1"],k:0,p:"sin 30° = 1/2."},
{j:"SMA",m:"Barisan & Deret",t:"sedang",tp:"isian",q:"Suku ke-10 dari barisan 3, 7, 11, ... adalah ...",k:39,p:"Un = a + (n−1)b = 3 + 9×4 = 39."},
{j:"SMA",m:"Barisan & Deret",t:"sedang",tp:"pgk",q:"Pilih semua barisan aritmetika.",o:["2, 5, 8, 11","1, 2, 4, 8","10, 7, 4, 1","3, 3, 3, 3"],k:[0,2,3],p:"Barisan aritmetika memiliki beda tetap. Opsi kedua berpola kali 2 (geometri)."},
{j:"SMA",m:"Limit",t:"sulit",tp:"bs",q:"Tentukan benar atau salah.",o:["lim x→2 (x² − 4)/(x − 2) = 4","lim x→∞ 1/x = 1","lim x→3 (2x + 1) = 7"],k:[true,false,true],p:"(x²−4)/(x−2) = x+2 → 4. lim 1/x untuk x→∞ adalah 0."},
{j:"SMA",m:"Statistika",t:"mudah",tp:"pg",q:"Rata-rata dari data 2, 4, 4, 6, 9 adalah ...",o:["4","5","6","7"],k:1,p:"25/5 = 5."},
{j:"SMA",m:"Peluang",t:"sedang",tp:"pg",q:"Tiga koin dilempar bersamaan. Peluang muncul tepat 2 gambar adalah ...",o:["1/8","3/8","1/2","5/8"],k:1,p:"Ada 3 kejadian (GGA, GAG, AGG) dari 8 kemungkinan → 3/8."},
{j:"SMA",m:"Barisan & Deret",t:"sulit",tp:"isian",q:"Jumlah 5 suku pertama deret geometri dengan a = 2 dan r = 3 adalah ...",k:242,p:"S5 = 2(3⁵ − 1)/(3 − 1) = 242."},
{j:"SMA",m:"Trigonometri",t:"sedang",tp:"pg",q:"Nilai cos 60° + sin 90° adalah ...",o:["1/2","1","3/2","2"],k:2,p:"1/2 + 1 = 3/2."},
{j:"SMA",m:"Fungsi",t:"sulit",tp:"pg",q:"Diketahui f(x) = 2x + 1 dan g(x) = x². Nilai (f∘g)(3) adalah ...",o:["7","10","19","49"],k:2,p:"g(3) = 9, f(9) = 2·9 + 1 = 19."}
];

/* ============ LOGIKA ============ */
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TL={pg:"Pilihan Ganda",pgk:"Pilihan Ganda Kompleks",bs:"Benar / Salah",isian:"Isian Singkat"};
const DURASI=60,JUMLAH=36,L="ABCDEFGH";
let S={name:"",kelas:"",jenjang:"SMP",mode:"simulasi",shuffle:true,fs:1},E=null,timer=null;
const set=h=>{app.innerHTML=h;window.scrollTo(0,0);$("#usr").textContent=S.name?S.kelas+" - "+S.name:""};

/* ===== GENERATOR SOAL: melengkapi bank hingga JUMLAH (36) soal per jenjang ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),U=a=>[...new Set(a)];
const PG=(j,m,t,q,c,w,p,s)=>{const o=shuf(U([c,...w].map(String)).slice(0,4));return{j,m,t,tp:"pg",q,s,o,k:o.indexOf(String(c)),p}};
const IS=(j,m,t,q,k,p,s)=>({j,m,t,tp:"isian",q,s,k,p});
const BS=(j,m,t,q,a,p)=>({j,m,t,tp:"bs",q,o:a.map(x=>x[0]),k:a.map(x=>x[1]),p});
const PK=(j,m,t,q,a,p)=>{const b=shuf(a);return{j,m,t,tp:"pgk",q,o:b.map(x=>String(x[0])),k:b.flatMap((x,i)=>x[1]?[i]:[]),p}};
const TBL=(h,n,v)=>`<table class=t><tr><th>${h}<th>Jumlah`+n.map((x,i)=>`<tr><td>${x}<td>${v[i]}`).join("")+"</table>"+bars(n,v);
const S3=()=>{const f=R(0,1),x=R(3,9),y=R(3,9);return[`${x} × ${y} = ${x*y+(f?0:R(1,5))}`,!!f]};
const S2=()=>{const f=R(0,1),a=R(3,12);return[`${a}² = ${a*a+(f?0:R(1,4))}`,!!f]};
const L1=()=>{const f=R(0,1),c=R(2,6);return[`lim x→${c} (x² − ${c*c})/(x − ${c}) = ${2*c+(f?0:1)}`,!!f]};
const L2=()=>{const f=R(0,1),p=R(2,5),d=R(2,6),q=R(1,5);return[`lim x→${d} (${p}x + ${q}) = ${p*d+q+(f?0:2)}`,!!f]};
const GEN={
SD:[
()=>{const a=R(120,480),b=R(120,480),c=a+b;return PG("SD","Operasi Bilangan","mudah",`${a} + ${b} = ...`,c,[c+10,c-10,c+100,c-100],`${a} + ${b} = ${c}.`)},
()=>{const a=R(500,900),b=R(100,450),c=a-b;return PG("SD","Operasi Bilangan","mudah",`${a} − ${b} = ...`,c,[c+10,c-10,c+100,c-100],`${a} − ${b} = ${c}.`)},
()=>{const a=R(12,35),b=R(3,9),c=a*b;return PG("SD","Operasi Bilangan","sedang",`Sebuah kotak berisi ${a} permen. Ada ${b} kotak. Jumlah permen seluruhnya ...`,c,[c+a,c-b,c+10,c-10],`${a} × ${b} = ${c}.`,ico("📦",b))},
()=>{const b=R(3,9),c=R(12,40);return IS("SD","Operasi Bilangan","sedang",`${b*c} permen dibagi sama banyak kepada ${b} anak. Setiap anak mendapat ... permen.`,c,`${b*c} : ${b} = ${c}.`,ico("🧒",b))},
()=>{const n=R(6,12),a=R(1,3),b=R(1,3),c=`${a+b}/${n}`;return PG("SD","Pecahan","sedang",`${a}/${n} + ${b}/${n} = ...`,c,[`${a+b}/${2*n}`,`${a+b+1}/${n}`,`${a*b}/${n}`,`${a+b+2}/${n}`],`Penyebut sama, jumlahkan pembilang: ${c}.`)},
()=>{const p=R(6,20),l=R(3,p-1);return IS("SD","Bangun Datar","sedang",`Persegi panjang berukuran ${p} cm × ${l} cm. Luasnya ... cm².`,p*l,`L = ${p} × ${l} = ${p*l}.`,rect(p,l))},
()=>{const v=[R(5,20),R(5,20),R(5,20),R(5,20)],c=v[0]+v[1]+v[2]+v[3];return PG("SD","Data Sederhana","mudah","Berdasarkan tabel, jumlah seluruh buah adalah ...",c,[c+1,c-1,c+5,c-5],`Jumlahkan semua data = ${c}.`,TBL("Buah",["Apel","Jeruk","Mangga","Pisang"],v))},
()=>{const n=R(2,5);return PK("SD","Operasi Bilangan","sedang",`Pilih semua bilangan kelipatan ${n}.`,[[n*R(2,5),1],[n*R(6,9),1],[n*R(10,12)+1,0],[n*R(2,8)+1,0]],`Kelipatan ${n} habis dibagi ${n}.`)},
()=>BS("SD","Operasi Bilangan","sedang","Tentukan benar atau salah.",[S3(),S3(),S3()],"Hitung hasil kali tiap pernyataan lalu bandingkan.")
],
SMP:[
()=>{const x=R(2,12),a=R(2,6),b=R(1,15);return PG("SMP","Persamaan Linear","sedang",`Penyelesaian dari ${a}x + ${b} = ${a*x+b} adalah x = ...`,x,[x+1,x-1,x+2,x*2],`${a}x = ${a*x}, sehingga x = ${x}.`)},
()=>{const p=R(2,6),q=R(2,9);return PG("SMP","Aljabar","sedang",`Bentuk ${p}(x + ${q}) sama dengan ...`,`${p}x + ${p*q}`,[`${p}x + ${q}`,`x + ${p*q}`,`${p+q}x`,`${p}x + ${p+q}`],`Sifat distributif: ${p}x + ${p*q}.`)},
()=>{const t=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15]][R(0,4)];return IS("SMP","Geometri","sedang",`Segitiga siku-siku memiliki sisi tegak ${t[0]} cm dan ${t[1]} cm. Panjang sisi miringnya ... cm.`,t[2],`√(${t[0]}² + ${t[1]}²) = ${t[2]}.`,tri(t[0],t[1]))},
()=>{const a=R(4,10),b=R(11,16),t=2*R(2,6),L=(a+b)*t/2;return IS("SMP","Geometri","sulit",`Trapesium memiliki sisi sejajar ${a} cm dan ${b} cm serta tinggi ${t} cm. Luasnya ... cm².`,L,`L = (${a}+${b}) × ${t} / 2 = ${L}.`,trap(a,b,t))},
()=>{const m=R(60,90),d=[R(-9,9),R(-9,9),R(-9,9),R(-9,9)];d.push(-d[0]-d[1]-d[2]-d[3]);return IS("SMP","Statistika","mudah",`Rata-rata dari data ${shuf(d.map(x=>m+x)).join(", ")} adalah ...`,m,`Jumlah data = ${5*m}, dibagi 5 = ${m}.`)},
()=>{const r=R(2,7),b=R(2,7);return PG("SMP","Peluang","sedang",`Kantong berisi ${r} bola merah dan ${b} bola biru. Satu bola diambil acak. Peluang terambil bola merah adalah ...`,`${r}/${r+b}`,[`${b}/${r+b}`,`${r}/${b}`,`${r+b}/${r}`],`Peluang = ${r} dari ${r+b} bola.`,balls(r,b))},
()=>{const m=R(2,6),c=R(1,9);return PG("SMP","Persamaan Linear","sedang",`Garis melalui titik (0, ${c}) dan (2, ${c+2*m}). Gradien garis tersebut adalah ...`,m,[c,2*m,m+1,m+2],`Gradien = ${2*m}/2 = ${m}.`)},
()=>{const x=R(2,9),k=R(2,5),a=R(1,5);return PK("SMP","Aljabar","sulit",`Pilih semua persamaan yang memiliki penyelesaian x = ${x}.`,[[`x + ${a} = ${x+a}`,1],[`${k}x = ${k*x}`,1],[`x − ${a} = ${x+a+1}`,0],[`${k}x = ${k*x+1}`,0]],`Substitusikan x = ${x} ke tiap persamaan.`)},
()=>BS("SMP","Aljabar","mudah","Tentukan benar atau salah.",[S2(),S2(),S2()],"Hitung kuadrat tiap bilangan.")
],
SMA:[
()=>{const a=R(2,6),b=R(1,9),c=R(2,9),v=a*c+b;return PG("SMA","Fungsi","mudah",`Jika f(x) = ${a}x + ${b}, maka f(${c}) = ...`,v,[v+a,v-b,v+b,a+b+c],`f(${c}) = ${a}·${c} + ${b} = ${v}.`)},
()=>{const T=[["0",0],["1/2",30],["√2/2",45],["√3/2",60],["1",90]],i=R(0,4);return PG("SMA","Trigonometri","mudah",`Nilai sin ${T[i][1]}° adalah ...`,T[i][0],T.filter((x,j)=>j!=i).map(x=>x[0]),`Sudut istimewa: sin ${T[i][1]}° = ${T[i][0]}.`)},
()=>{const a=R(2,9),b=R(2,6),n=R(8,15);return IS("SMA","Barisan & Deret","sedang",`Suku ke-${n} dari barisan ${a}, ${a+b}, ${a+2*b}, ... adalah ...`,a+(n-1)*b,`Un = a + (n−1)b = ${a} + ${n-1}×${b} = ${a+(n-1)*b}.`)},
()=>{const a=R(2,6),b=R(2,5),n=2*R(3,6),s=n*(2*a+(n-1)*b)/2;return IS("SMA","Barisan & Deret","sulit",`Jumlah ${n} suku pertama deret ${a} + ${a+b} + ${a+2*b} + ... adalah ...`,s,`Sn = n/2·(2a + (n−1)b) = ${s}.`)},
()=>{const a=R(1,4),r=R(2,3),n=R(4,6),u=a*r**(n-1);return IS("SMA","Barisan & Deret","sedang",`Barisan geometri memiliki suku pertama ${a} dan rasio ${r}. Suku ke-${n} adalah ...`,u,`Un = a·r^(n−1) = ${a}×${r}^${n-1} = ${u}.`)},
()=>BS("SMA","Limit","sulit","Tentukan benar atau salah.",[L1(),L2(),L2()],"Faktorkan atau substitusi langsung pada tiap limit."),
()=>{const v=Array.from({length:5},()=>R(3,20)),m=[...v].sort((x,y)=>x-y)[2];return IS("SMA","Statistika","sedang",`Median dari data ${v.join(", ")} adalah ...`,m,`Urutkan data; nilai tengah = ${m}.`)},
()=>{const n=R(2,12),c=6-Math.abs(7-n);return PG("SMA","Peluang","sulit",`Dua dadu dilempar bersamaan. Peluang jumlah kedua mata dadu sama dengan ${n} adalah ...`,`${c}/36`,[`${c+1}/36`,`${c+2}/36`,`${c}/12`,`${c+3}/36`],`Ada ${c} pasangan dari 36 kemungkinan.`)},
()=>{const a=R(2,6),b=R(2,5);return PK("SMA","Barisan & Deret","sulit",`Barisan ${a}, ${a+b}, ${a+2*b}, ... Pilih semua bilangan yang merupakan suku barisan tersebut.`,[[a+4*b,1],[a+7*b,1],[a+4*b+1,0],[a+7*b-1,0]],`Suku barisan berbentuk ${a} + n·${b}.`)}
]};

function pPick(){const c=(k,v,t)=>`<button class="${S[k]===v?'on':''}" onclick="S.${k}='${v}';pPick()">${t}</button>`;
set(`<div class="card" style="max-width:640px;margin:4vh auto"><div style="text-align:center"><div class="logo">📐</div><h1>Simulasi Ujian Matematika</h1><p class="mut">Gaya TKA & ANBK · latihan berbasis komputer</p></div><h2>Pilih Jenjang & Mode</h2>

function pData(){const r=(a,b)=>`<tr><td class="mut">${a}<td><b>${b}</b>`;
set(`<div class="card" style="max-width:640px;margin:4vh auto"><h2>Konfirmasi Data Peserta</h2>
<p class="mut">Pastikan data berikut sudah benar sebelum memulai ujian.</p>
<table class="t" style="width:100%">${r("Nama",esc(S.name))}${r("Kelas",esc(S.kelas))}${r("Jenjang",S.jenjang)}${r("Mode",S.mode==="simulasi"?"Simulasi":"Latihan")}${r("Jumlah Soal",JUMLAH)}${r("Durasi",DURASI+" menit")}${r("Acak Soal & Opsi",S.shuffle?"Ya":"Tidak")}</table>
<div class="row"><button onclick="pPick()">Ubah Jenjang</button><button onclick="pLogin()">Ubah Data Diri</button><span class="sp"></span><button class="g" onclick="start()">Mulai Ujian ▶</button></div></div>`)}
function start(){
let qs=BANK.map((q,i)=>({...q,id:i+1})).filter(q=>q.j===S.jenjang);
if(S.shuffle)qs=shuf(qs);
qs=qs.map(q=>({...q,ord:!q.o?[]:(S.shuffle&&q.tp!=="bs"?shuf(q.o.map((_,i)=>i)):q.o.map((_,i)=>i))}));
E={qs,ans:{},flag:{},chk:{},i:0,left:DURASI*60};
clearInterval(timer);timer=setInterval(tick,1000);
window.onbeforeunload=e=>{e.preventDefault();return ""};pExam()}

const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tick(){E.left--;const t=$("#tm");if(t){t.textContent=fmt(Math.max(E.left,0));t.classList.toggle("red",E.left<=300)}
if(E.left<=0)finish()}

const cq=()=>E.qs[E.i];
function answered(q){const a=E.ans[q.id];
if(a===undefined)return false;
return q.tp==="pgk"?a.length>0:q.tp==="bs"?Object.keys(a).length===q.o.length:q.tp==="isian"?String(a).trim()!=="":true}
function correct(q){const a=E.ans[q.id];if(!answered(q))return false;
if(q.tp==="pg")return a===q.k;
if(q.tp==="pgk")return a.length===q.k.length&&q.k.every(x=>a.includes(x));
if(q.tp==="bs")return q.k.every((v,i)=>a[i]===v);
return Number(String(a).replace(",",".").trim())===q.k}
const bsT=(q,a)=>q.o.map((x,i)=>`${esc(x)} → <b>${a[i]===undefined?"–":a[i]?"Benar":"Salah"}</b>`).join("<br>");
function keyTxt(q){return q.tp==="pg"?L[q.ord.indexOf(q.k)]+". "+esc(q.o[q.k]):q.tp==="pgk"?q.k.map(i=>esc(q.o[i])).join("; "):q.tp==="bs"?bsT(q,q.k):q.k}
function usrTxt(q){const a=E.ans[q.id];if(!answered(q))return "<i>Tidak dijawab</i>";
return q.tp==="pg"?L[q.ord.indexOf(a)]+". "+esc(q.o[a]):q.tp==="pgk"?a.map(i=>esc(q.o[i])).join("; "):q.tp==="bs"?bsT(q,a):esc(a)}

function pExam(){const jj=S.jenjang==="SD"?"SD/MI":S.jenjang==="SMP"?"SMP/MTs":"SMA/MA";set(`<div data-fs="${S.fs}" class="card" style="padding:24px 28px"><div class="eh"><div><h2 style="font-weight:400;font-size:1.6rem;margin:0 0 8px">Soal nomor <span id="no"></span></h2>
<div class="fz">Ukuran font soal: <button onclick="fs(0)" style="font-size:12px">A</button><button onclick="fs(1)" style="font-size:18px">A</button><button onclick="fs(2)" style="font-size:24px">A</button></div></div>
<div class="er"><div class="chips" style="justify-content:flex-end"><button class="pill b" onclick="info()">INFORMASI SOAL</button><span class="pill">Sisa Waktu : <b class="tm" id="tm">${fmt(E.left)}</b></span><button class="pill b2" onclick="$('#dlm').hidden=false">Daftar Soal ▦</button></div>
<div class="sub">Numerasi - ${jj}/${S.mode==="simulasi"?"SIMULASI":"LATIHAN"}</div></div></div><hr><div id="qc"></div></div>
<div class="mod" id="dlm" hidden onclick="if(event.target===this)this.hidden=true"><div class="card mc"><h3>Daftar Soal</h3><div class="grid" id="gr"></div>
<div class="lg"><i style="background:var(--gray)"></i>Belum<i style="background:var(--ok)"></i>Dijawab<i style="background:var(--warn)"></i>Ragu</div>
<div class="row"><button class="sp" onclick="$('#dlm').hidden=true">Tutup</button></div></div></div>`);
rQ();nav()}
function info(){const q=cq();alert("Materi: "+q.m+"\nTingkat: "+q.t+"\nJenis soal: "+TL[q.tp]+"\nSoal "+(E.i+1)+" dari "+E.qs.length)}
function fs(n){S.fs=n;$("[data-fs]").dataset.fs=n}
function nav(){$("#gr").innerHTML=E.qs.map((q,i)=>`<button class="${E.flag[q.id]?'f':answered(q)?'d':''} ${i===E.i?'c':''}" onclick="go(${i})">${i+1}</button>`).join("")}
function go(i){E.i=i;rQ();nav();const m=$("#dlm");if(m)m.hidden=true}

function rQ(){const q=cq(),a=E.ans[q.id],lock=E.chk[q.id]?"disabled":"";let inp="";
if(q.tp==="pg")inp=q.ord.map((oi,p)=>`<label class="op"><input type="radio" name="r" ${a===oi?'checked':''} ${lock} onchange="sA(${oi})"><span>${esc(q.o[oi])}</span></label>`).join("");
if(q.tp==="pgk")inp=`<p class="mut">Pilih lebih dari satu jawaban jika perlu.</p>`+q.ord.map((oi,p)=>`<label class="op"><input type="checkbox" ${a&&a.includes(oi)?'checked':''} ${lock} onchange="sK(${oi})"><span>${esc(q.o[oi])}</span></label>`).join("");
if(q.tp==="bs")inp=`<table class="t bs" style="width:100%"><tr><th>Pernyataan<th>Benar<th>Salah</tr>`+q.o.map((x,i)=>`<tr><td>${esc(x)}<td><input type="radio" name="b${i}" ${a&&a[i]===true?'checked':''} ${lock} onchange="sB(${i},true)"><td><input type="radio" name="b${i}" ${a&&a[i]===false?'checked':''} ${lock} onchange="sB(${i},false)"></tr>`).join("")+`</table>`;
if(q.tp==="isian")inp=`<input type="text" inputmode="decimal" placeholder="Ketik jawaban angka" value="${a?esc(a):''}" ${lock} oninput="sI(this.value)" style="max-width:260px">`;
const last=E.i===E.qs.length-1;
let fb="";if(E.chk[q.id]){const ok=correct(q);fb=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ Jawaban benar!':'❌ Belum tepat.'}</b><br>Kunci: ${keyTxt(q)}<br><br><b>Pembahasan:</b> ${q.p}</div>`}
$("#no").textContent=E.i+1;const c=$("#qc");c.className="qb"+(q.s?" split":"");
c.innerHTML=`${q.s?`<div class="stim"><h3 style="text-align:center;margin-bottom:14px">${q.m}</h3>${q.s}</div>`:""}<div class="qr"><div class="qt">${q.q}</div>${inp}${fb}</div>
<div class="row noprint nv"><button ${E.i?'':'disabled'} onclick="go(E.i-1)">← Sebelumnya</button>
<button class="w ${E.flag[q.id]?'on2':''}" onclick="flg()">⚑ Ragu-ragu</button>
${S.mode==='latihan'&&!E.chk[q.id]?'<button class="p" onclick="chk()">Periksa</button>':''}<span class="sp"></span>
${last?'<button class="g" onclick="pConfirm()">Selesai ✔</button>':'<button class="p" onclick="go(E.i+1)">Selanjutnya →</button>'}</div>`}
const id=()=>cq().id;
function sA(v){E.ans[id()]=v;nav()}
function sK(v){const a=E.ans[id()]||[];const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);E.ans[id()]=a;nav()}
function sB(i,v){(E.ans[id()]=E.ans[id()]||{})[i]=v;nav()}
function sI(v){E.ans[id()]=v;nav()}
function flg(){E.flag[id()]=!E.flag[id()];rQ();nav()}
function chk(){if(!answered(cq()))return alert("Jawab dulu sebelum memeriksa.");E.chk[id()]=1;rQ()}

function pConfirm(){const n=E.qs.length,d=E.qs.filter(answered).length,f=Object.values(E.flag).filter(Boolean).length;
set(`<div class="card" style="max-width:560px;margin:6vh auto"><h2>Konfirmasi Selesai</h2>
<div class="stats"><div class="stat"><b>${d}</b>Dijawab</div><div class="stat"><b>${n-d}</b>Kosong</div><div class="stat"><b>${f}</b>Ragu-ragu</div></div>
${n-d?`<p style="color:var(--bad)">⚠️ Masih ada <b>${n-d}</b> soal belum dijawab.</p>`:''}
<p class="mut">Sisa waktu: <b id="tm2">${fmt(E.left)}</b>. Setelah dikumpulkan, jawaban tidak dapat diubah.</p>
<div class="row"><button onclick="pExam()">← Kembali ke Soal</button><span class="sp"></span><button class="g" onclick="finish()">Ya, Kumpulkan</button></div></div>`)}

function finish(){clearInterval(timer);window.onbeforeunload=null;pResult()}

function pResult(){const n=E.qs.length,res=E.qs.map(q=>({q,ok:correct(q),ans:answered(q)}));
const b=res.filter(r=>r.ok).length,k=res.filter(r=>!r.ans).length,s=res.length-b-k,score=Math.round(b/n*100);
const M={};res.forEach(r=>{(M[r.q.m]=M[r.q.m]||{b:0,n:0});M[r.q.m].n++;if(r.ok)M[r.q.m].b++});
const mm=Object.entries(M).map(([m,v])=>({m,p:Math.round(v.b/v.n*100),...v})).sort((x,y)=>y.p-x.p);
const best=mm.filter(x=>x.p===mm[0].p).map(x=>x.m).join(", "),worst=mm.filter(x=>x.p===mm[mm.length-1].p).map(x=>x.m).join(", ");
const msg=score>=80?"Hebat! Pertahankan.":score>=60?"Cukup baik, terus berlatih.":"Ayo belajar lagi, kamu pasti bisa!";
set(`<div class="card"><div style="text-align:center"><p class="mut">Hasil ${esc(S.name)} · ${esc(S.kelas)} · ${S.jenjang}</p><div class="score">${score}</div><p>${msg}</p></div>
<div class="stats"><div class="stat" style="color:var(--ok)"><b>${b}</b>Benar</div><div class="stat" style="color:var(--bad)"><b>${s}</b>Salah</div><div class="stat"><b>${k}</b>Kosong</div></div>
<h3>Skor per Materi</h3>${mm.map(x=>`<div><div style="display:flex;justify-content:space-between"><span>${x.m}</span><b>${x.p}% (${x.b}/${x.n})</b></div><div class="bar"><div style="width:${x.p}%"></div></div></div>`).join("")}
